<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Offline - Silent Signal</title>
    <meta name="theme-color" content="#5b63b7">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="96x96" href="icons/icon-96.png">
    <link href="vendor/material-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="vendor/materialize.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .offline-hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        .offline-hero .mark {
            width: 72px;
            height: 72px;
            margin-bottom: 24px;
        }

        .offline-hero i.big-icon {
            font-size: 64px;
            color: var(--primary);
            margin-bottom: 16px;
        }

        .offline-hero h1 {
            font-size: 34px;
            margin: 0 0 12px;
        }

        .offline-hero p {
            color: var(--muted);
            font-size: 17px;
            max-width: 420px;
            margin-bottom: 28px;
        }
    </style>
</head>

<body>

    <div class="offline-hero">
        <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
            <circle cx="20" cy="20" r="19" fill="none" stroke="#5b63b7" stroke-width="1.5" />
            <circle cx="20" cy="20" r="11" fill="none" stroke="#5b63b7" stroke-width="1.5" opacity=".6" />
            <circle cx="20" cy="20" r="4" fill="#5b63b7" />
        </svg>
        <i class="material-icons big-icon">wifi_off</i>
        <h1>You're currently offline</h1>
        <p>Some features may not be available right now. Your reports and drafts are safe -
            reconnect and try again in a moment.</p>
        <a href="./index.html" class="btn-large">Try again</a>
    </div>

    <script src="vendor/materialize.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
